name: Release Evidence

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Install pinned required product adapters
        run: |
          python -m pip install "aws-agent-identity-guard @ git+https://github.com/poojakira/aws-agent-identity-guard.git@8ba7abbbaff9d0a3f9a8ff69a9811d390c15b46e"
          python -m pip install "hf-scanner @ git+https://github.com/poojakira/hf-model-provenance-scanner.git@e0cb4018f40bfac51a783e9a7e194a4313e5246b"
      - name: Run required real adapter release gates
        run: |
          python -m mlsec_benchmark_suite run-iam-lint --output results/release-iam.json --overwrite
          python -m mlsec_benchmark_suite validate results/release-iam.json
          python -m mlsec_benchmark_suite run-hf-scanner --output results/release-hf.json --overwrite
          python -m mlsec_benchmark_suite validate results/release-hf.json

      - name: Build wheel
        run: python -m build
      - name: Generate SBOM
        run: python -m pip_audit -r requirements.txt --format cyclonedx-json --output sbom.cdx.json
      - name: Generate signed smoke result
        env:
          MLSEC_BENCH_SIGNING_KEY: ${{ secrets.MLSEC_BENCH_SIGNING_KEY }}
        run: |
          if [ -n "$MLSEC_BENCH_SIGNING_KEY" ]; then
            python -m mlsec_benchmark_suite.cli run-smoke \
              --output results/release-smoke.json \
              --repository poojakira/mlsec-benchmark-suite \
              --repository-commit "$GITHUB_SHA" \
              --artifact-digest "sha256:$(sha256sum dist/*.whl | awk '{print $1}')" \
              --model-hash "sha256:none" \
              --dependency-lock-hash "sha256:$(sha256sum pyproject.toml | awk '{print $1}')"
            python -m mlsec_benchmark_suite.cli validate results/release-smoke.json --require-signature
          else
            echo 'Signing key not configured, skipping signed validation'
            python -m mlsec_benchmark_suite.cli run-smoke \
              --output results/release-smoke.json \
              --repository poojakira/mlsec-benchmark-suite \
              --repository-commit "$GITHUB_SHA" \
              --artifact-digest "sha256:$(sha256sum dist/*.whl | awk '{print $1}')" \
              --model-hash "sha256:none" \
              --dependency-lock-hash "sha256:$(sha256sum pyproject.toml | awk '{print $1}')"
            python -m mlsec_benchmark_suite.cli validate results/release-smoke.json
          fi
      - name: Attest release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*
            sbom.cdx.json
            results/release-smoke.json
            results/release-iam.json
            results/release-hf.json