name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Coverage Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage gate
        run: |
          pytest tests/ \
            --cov=mlsec_benchmark_suite \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85 \
            -v

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check mlsec_benchmark_suite/ tests/

      - name: Run mypy
        run: mypy mlsec_benchmark_suite/ --ignore-missing-imports

  tracker:
    name: Continuous Benchmark Tracking
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for result tracking

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run benchmark suite
        run: |
          COMMIT="${GITHUB_SHA}"
          DIGEST="sha256:$(git rev-parse HEAD)"
          MODEL_HASH="sha256:$(printf '%s' "$COMMIT" | sha256sum | cut -d' ' -f1)"
          LOCK_HASH="sha256:$(sha256sum requirements.txt 2>/dev/null | cut -d' ' -f1 || echo none)"
          python -m mlsec_benchmark_suite run-smoke \
            --output results/smoke-result.json \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-commit "${COMMIT}" \
            --artifact-digest "${DIGEST}" \
            --model-hash "${MODEL_HASH}" \
            --dependency-lock-hash "${LOCK_HASH}" \
            --overwrite

      - name: Run trend analysis
        run: |
          python -m mlsec_benchmark_suite.tracker results/ reports/trend_report.md

      - name: Upload trend report
        uses: actions/upload-artifact@v4
        with:
          name: trend-report
          path: reports/trend_report.md

      - name: Comment on PR with trend report
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark-trend
          path: reports/trend_report.md

  adapter-benchmarks:
    name: Adapter Benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install aws-agent-identity-guard || echo 'aws-agent-identity-guard not available, skipping'
          pip install hf-model-provenance-scanner || echo 'hf-model-provenance-scanner not available, skipping'

      - name: Run IAM lint benchmark (fixture-only, no network)
        run: |
          python -m mlsec_benchmark_suite run-iam-lint \
            --output results/ci_iam_lint.json \
            --overwrite \
            || echo 'IAM lint benchmark failed'

      - name: Run HF scanner benchmark (fixture-only, no network)
        run: |
          python -m mlsec_benchmark_suite run-hf-scanner \
            --output results/ci_hf_scanner.json \
            --overwrite \
            || echo 'HF scanner benchmark failed'

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: adapter-benchmark-results
          path: results/*.json
          if-no-files-found: ignore

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run bandit security scan
        run: bandit -r mlsec_benchmark_suite/ -c pyproject.toml

      - name: Check dependency vulnerabilities
        run: pip-audit
